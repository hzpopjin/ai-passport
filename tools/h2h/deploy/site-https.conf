limit_req_zone $binary_remote_addr zone=h2h_api:10m rate=20r/s;
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ai-passport.randomdance.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-passport.randomdance.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name ai-passport.randomdance.cn;
    root /www/wwwroot/ai-passport.randomdance.cn/current/public;
    index index.html;
    access_log /www/wwwlogs/ai-passport.randomdance.cn.access.log;
    error_log /www/wwwlogs/ai-passport.randomdance.cn.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ai-passport.randomdance.cn/shared/acme;
    }
    location /api/ {
        limit_req zone=h2h_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }
    location /card/ {
        limit_req zone=h2h_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
    # Pairing codes and SSO callback codes are short-lived credentials.
    location /pair/ {
        access_log off;
        limit_req zone=h2h_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sso/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
    }
    location = /login { proxy_pass http://127.0.0.1:8878; proxy_set_header Host $host; }
    location = /account { proxy_pass http://127.0.0.1:8878; proxy_set_header Host $host; }
    location /account/ {
        proxy_pass http://127.0.0.1:8878;
        proxy_set_header Host $host;
    }
    location = /logout { proxy_pass http://127.0.0.1:8878; proxy_set_header Host $host; }
    location = /healthz { proxy_pass http://127.0.0.1:8878; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; expires -1; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

server {
    listen 80;
    server_name ai-passport.randomdance.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ai-passport.randomdance.cn/shared/acme;
    }
    location / { return 301 https://ai-passport.randomdance.cn$request_uri; }
}
